name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The doc-hygiene guard resolves revision citations a commit range introduces,
          # so the range base must exist. Default depth 1 has no HEAD~1 and skipped it.
          fetch-depth: 2
      - uses: leanprover/lean-action@v1
        # Uses the pinned toolchain (lean-toolchain) and runs `lake build`, which also
        # elaborates the #eval / example smoke checks.
      - name: Exercise Lean source-hygiene guard
        run: ./scripts/test-check-lean-source-hygiene.sh
      - name: Audit trust and published README statistics
        run: ./scripts/prepare-github-publish.sh --check
      - name: Replay retained kernel evidence
        run: lake test
      - name: Check reference process contract
        run: lake exe checkReferenceProcess
      - name: Check bounded process boundary
        run: lake exe checkBoundedProcess
